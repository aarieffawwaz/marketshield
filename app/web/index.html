<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MarketShield: peringatan dini erupsi berbasis satelit, filter hoaks, harga HET dan prioritas bantuan.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MarketShield">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MarketShield</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Start fetching the app code in parallel with the bootstrap script and the CanvasKit engine. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#FFF8F3">
  <div id="splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:system-ui,-apple-system,sans-serif;color:#350915;transition:opacity .35s">
    <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#7B1E26"/><path d="M32 12 50 19v13c0 11-7.6 18.6-18 21-10.4-2.4-18-10-18-21V19z" fill="#fff"/><path d="M20 40 28 28l5 6 4-5 7 11z" fill="#B51A14"/><circle cx="37" cy="23" r="3" fill="#EA6A1F"/></svg>
    <div style="font-weight:700;font-size:20px;letter-spacing:-.01em">MarketShield</div>
    <div style="width:120px;height:3px;border-radius:3px;background:#EFE5E2;overflow:hidden"><div id="bar" style="width:30%;height:100%;background:#7B1E26;border-radius:3px;animation:ms 1.1s ease-in-out infinite"></div></div>
    <style>@keyframes ms{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}</style>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
