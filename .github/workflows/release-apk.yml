name: Release APK

# Push a tag like v1.0.1 to build signed APKs and publish a GitHub Release.
# The download page picks up the latest release automatically.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.1)"
        required: true

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore signing key
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build APKs
        working-directory: app
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          flutter pub get
          flutter build apk --release --split-per-abi --build-name "${TAG#v}" --build-number "${{ github.run_number }}"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/marketshield-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../dist/marketshield-armv7.apk
          cd ../dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/marketshield-arm64.apk
            dist/marketshield-armv7.apk
            dist/SHA256SUMS.txt
