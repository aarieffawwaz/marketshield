name: Deploy

# Builds the Flutter web app into web/public/mobile-app, then builds the Next.js site.
# Pull requests only build (to stay inside Vercel's free upload quota); main deploys to production.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.6
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets are not available to PRs from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Flutter web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --base-href /mobile-app/ --no-web-resources-cdn

      - name: Copy Flutter build into the site
        run: |
          rm -rf web/public/mobile-app
          cp -r app/build/web web/public/mobile-app

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Build
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$PROD" = "true" ]; then ENV=production; FLAG=--prod; else ENV=preview; FLAG=; fi
          vercel pull --yes --environment=$ENV --token="$VERCEL_TOKEN"
          vercel build $FLAG --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
